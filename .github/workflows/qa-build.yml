name: QA Build (Pre-Release)

# Triggers when code is pushed to QA branch
# Creates test builds for manual testing before production release

on:
  push:
    branches:
      - QA
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 4.0.1-rc1)'
        required: true
        default: '4.0.0-rc1'

jobs:
  # ==========================================================================
  # Get Version Info
  # ==========================================================================
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Auto-generate version from date + short SHA
            VERSION="4.0.0-qa.$(date +%Y%m%d).${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building QA version: $VERSION"

  # ==========================================================================
  # Build macOS App
  # ==========================================================================
  build-macos:
    name: Build macOS App
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller rumps
          
      - name: Create PyInstaller spec
        working-directory: ./app
        run: |
          cat > QueryAnalyzer.spec << 'SPEC_EOF'
          # -*- mode: python ; coding: utf-8 -*-
          
          block_cipher = None
          
          a = Analysis(
              ['app.py'],
              pathex=[],
              binaries=[],
              datas=[
                  ('index.html', '.'),
                  ('assets', 'assets'),
                  ('docs', 'docs'),
                  ('config.json', '.'),
                  ('ai_analyzer.py', '.'),
                  ('ai_models_list.json.template', '.'),
                  ('payload_reference.json.template', '.'),
              ],
              hiddenimports=[
                  'flask',
                  'flask_cors',
                  'requests',
                  'openai',
                  'icecream',
                  'webbrowser',
                  'rumps',
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False,
          )
          
          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
          
          exe = EXE(
              pyz,
              a.scripts,
              [],
              exclude_binaries=True,
              name='QueryAnalyzer',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )
          
          coll = COLLECT(
              exe,
              a.binaries,
              a.zipfiles,
              a.datas,
              strip=False,
              upx=True,
              upx_exclude=[],
              name='QueryAnalyzer',
          )
          
          app = BUNDLE(
              coll,
              name='QueryAnalyzer.app',
              icon='assets/img/QueryAnalyzer.icns',
              bundle_identifier='io.fuj.cb.queryanalyzer',
              info_plist={
                  'CFBundleName': 'CB Query Analyzer',
                  'CFBundleDisplayName': 'CB Query Analyzer',
                  'CFBundleShortVersionString': '4.0.0',
                  'CFBundleVersion': '4.0.0',
                  'NSHighResolutionCapable': True,
                  'LSBackgroundOnly': False,
                  'LSUIElement': False,
              },
          )
          SPEC_EOF
          
      - name: Build with PyInstaller
        working-directory: ./app
        run: |
          pyinstaller QueryAnalyzer.spec --clean --noconfirm
            
      - name: Create DMG
        working-directory: ./app
        run: |
          mkdir -p dist/dmg
          cp -R dist/QueryAnalyzer.app dist/dmg/
          hdiutil create -volname "QueryAnalyzer-QA" \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            dist/QueryAnalyzer-${{ needs.version.outputs.version }}-macos.dmg
            
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueryAnalyzer-${{ needs.version.outputs.version }}-macos
          path: app/dist/QueryAnalyzer-${{ needs.version.outputs.version }}-macos.dmg
          retention-days: 14

  # ==========================================================================
  # Build Windows Executable
  # ==========================================================================
  build-windows:
    name: Build Windows Executable
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build with PyInstaller
        working-directory: ./app
        run: |
          pyinstaller --name QueryAnalyzer `
            --onefile `
            --windowed `
            --icon "assets/img/app_icon.ico" `
            --add-data "index.html;." `
            --add-data "assets;assets" `
            --add-data "docs;docs" `
            --add-data "config.json;." `
            --add-data "ai_analyzer.py;." `
            --add-data "ai_models_list.json.template;." `
            --add-data "payload_reference.json.template;." `
            --hidden-import flask `
            --hidden-import flask_cors `
            --hidden-import requests `
            --hidden-import openai `
            --hidden-import icecream `
            --hidden-import webbrowser `
            --hidden-import pystray `
            --hidden-import PIL `
            app.py
            
      - name: Create ZIP
        working-directory: ./app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\QueryAnalyzer.exe" -DestinationPath "dist\QueryAnalyzer-${{ needs.version.outputs.version }}-windows.zip"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueryAnalyzer-${{ needs.version.outputs.version }}-windows
          path: app/dist/QueryAnalyzer-${{ needs.version.outputs.version }}-windows.zip
          retention-days: 14

  # ==========================================================================
  # Create Pre-Release with all artifacts
  # ==========================================================================
  create-prerelease:
    name: Create Pre-Release
    needs: [version, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: QueryAnalyzer-${{ needs.version.outputs.version }}-macos
          path: ./artifacts
          
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: QueryAnalyzer-${{ needs.version.outputs.version }}-windows
          path: ./artifacts
          
      - name: List artifacts
        run: ls -la ./artifacts/
          
      - name: Create Pre-Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "🧪 QA Build - ${{ needs.version.outputs.version }}"
          body: |
            ## 🧪 QA Test Build - ${{ needs.version.outputs.version }}
            
            **⚠️ This is a pre-release for testing purposes only.**
            
            ### Downloads
            
            | Platform | File |
            |----------|------|
            | macOS | `QueryAnalyzer-${{ needs.version.outputs.version }}-macos.dmg` |
            | Windows | `QueryAnalyzer-${{ needs.version.outputs.version }}-windows.zip` |
            
            ### Testing Checklist
            
            - [ ] macOS: App launches correctly
            - [ ] macOS: Can connect to Couchbase
            - [ ] macOS: AI analysis works
            - [ ] Windows: App launches correctly
            - [ ] Windows: Can connect to Couchbase
            - [ ] Windows: AI analysis works
            
            ---
            
            **Branch**: `QA`  
            **Commit**: ${{ github.sha }}  
            **Workflow**: ${{ github.run_id }}
            
            If testing passes, merge QA → main and create a production release tag.
          draft: false
          prerelease: true
          files: |
            ./artifacts/QueryAnalyzer-${{ needs.version.outputs.version }}-macos.dmg
            ./artifacts/QueryAnalyzer-${{ needs.version.outputs.version }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
