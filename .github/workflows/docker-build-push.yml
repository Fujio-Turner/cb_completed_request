name: Build and Push Docker Image (Server Edition)

# Public Docker Hub publish — runs ONLY when code lands on main or a v4.* tag
# is pushed. The `liquid` branch performs a dry-run build (no push) via
# liquid-dryrun.yml.

on:
  push:
    branches:
      - main
    tags:
      - 'v4.*'
  pull_request:
    branches:
      - main

jobs:
  build-server:
    name: Server Edition (Flask)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (Server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/couchbase-query-analyzer
          tags: |
            type=ref,event=pr,suffix=-server
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=server-latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v4') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v4') }}

      - name: Build and push Server Edition
        uses: docker/build-push-action@v6
        with:
          # Dockerfile expects /app as build context (uses `COPY . .`)
          context: ./app
          file: ./app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          platforms: linux/amd64,linux/arm64
