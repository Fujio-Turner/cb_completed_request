name: Build Windows Executable

on:
  push:
    tags:
      - 'v4.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 4.0.0)'
        required: true
        default: '4.0.0'

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract version from tag (v4.0.0 -> 4.0.0)
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create PyInstaller spec file
        working-directory: ./app
        shell: bash
        run: |
          cat > QueryAnalyzer.spec << 'EOF'
          # -*- mode: python ; coding: utf-8 -*-
          
          block_cipher = None
          
          a = Analysis(
              ['app.py'],
              pathex=[],
              binaries=[],
              datas=[
                  ('index.html', '.'),
                  ('assets', 'assets'),
                  ('docs', 'docs'),
                  ('config.json', '.'),
              ],
              hiddenimports=[
                  'flask',
                  'flask_cors',
                  'couchbase',
                  'couchbase.cluster',
                  'couchbase.auth',
                  'couchbase.options',
                  'couchbase.exceptions',
                  'requests',
                  'openai',
                  'icecream',
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False,
          )
          
          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
          
          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.zipfiles,
              a.datas,
              [],
              name='QueryAnalyzer',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              upx_exclude=[],
              runtime_tmpdir=None,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
              icon=None,
              version_info={
                  'CompanyName': 'Fujio Turner',
                  'FileDescription': 'Couchbase Query Analyzer',
                  'FileVersion': '${{ steps.version.outputs.VERSION }}',
                  'ProductName': 'Couchbase Query Analyzer',
                  'ProductVersion': '${{ steps.version.outputs.VERSION }}',
              },
          )
          EOF

      - name: Build with PyInstaller
        working-directory: ./app
        run: |
          pyinstaller QueryAnalyzer.spec --clean

      - name: Create ZIP archive
        working-directory: ./app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\QueryAnalyzer.exe" -DestinationPath "dist\QueryAnalyzer-${{ steps.version.outputs.VERSION }}-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueryAnalyzer-${{ steps.version.outputs.VERSION }}-windows
          path: |
            app/dist/QueryAnalyzer.exe
            app/dist/QueryAnalyzer-${{ steps.version.outputs.VERSION }}-windows.zip
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/dist/QueryAnalyzer-${{ steps.version.outputs.VERSION }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
