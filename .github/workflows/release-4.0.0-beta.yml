name: Release 4.0.0-beta (Public Pre-Release)

# PUBLIC publishing pipeline for the `release-4.0.0-beta` branch.
#
# What this does on every push to `release-4.0.0-beta`:
#   1. Builds the Server Edition Docker image and PUSHES to Docker Hub as
#      `4.0.0-beta` (moving) and `4.0.0-beta.<short-sha>` (immutable).
#      It does NOT touch the `:latest` tag (pre-releases never move :latest).
#   2. Builds the macOS .dmg with PyInstaller (tray icon + console window).
#   3. Builds the Windows .exe with PyInstaller (tray icon + console window).
#   4. Creates / updates the GitHub Release `v4.0.0-beta` (prerelease=true)
#      and attaches the .dmg and .exe.zip as downloadable assets.
#
# Notes:
#   - The `liquid` branch still uses `liquid-dryrun.yml` (build-only, no
#     publish). This workflow is the public-facing counterpart for the
#     specific 4.0.0-beta release branch.
#   - Pushing the same branch multiple times overwrites assets on the same
#     `v4.0.0-beta` release tag (softprops/action-gh-release is idempotent).
#   - When promoting to a final 4.0.0 release: merge to `main` and push tag
#     `v4.0.0` — `release.yml` handles that path.

on:
  push:
    branches:
      - release-4.0.0-beta
  workflow_dispatch: {}

env:
  RELEASE_VERSION: 4.0.0-beta
  RELEASE_TAG: v4.0.0-beta

jobs:
  # ==========================================================================
  # Docker — build + push to Docker Hub (multi-arch)
  # ==========================================================================
  publish-docker:
    name: Publish Docker (4.0.0-beta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Server Edition (multi-arch, NO :latest)
        uses: docker/build-push-action@v6
        with:
          # Dockerfile uses `COPY . .` — context MUST be /app
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/couchbase-query-analyzer:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/couchbase-query-analyzer:${{ env.RELEASE_VERSION }}.${{ steps.sha.outputs.SHORT_SHA }}

  # ==========================================================================
  # macOS app (.dmg) — published to GitHub Release
  # Uses app/build_mac.spec + fetch_libcblite_macos.sh + couchbase-lite-python.
  # ==========================================================================
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - uses: ./.github/actions/build-desktop
        with:
          os: macos
          version: ${{ env.RELEASE_VERSION }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: app/dist/QueryAnalyzer-${{ env.RELEASE_VERSION }}-UNSIGNED-arm64.dmg
          retention-days: 14

  # ==========================================================================
  # Windows onedir zip — published to GitHub Release
  # Uses app/build_win.spec + fetch_libcblite_windows.ps1 + couchbase-lite-python.
  # ==========================================================================
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - uses: ./.github/actions/build-desktop
        with:
          os: windows
          version: ${{ env.RELEASE_VERSION }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: app/dist/QueryAnalyzer-${{ env.RELEASE_VERSION }}-UNSIGNED-x64.zip
          retention-days: 14

  # ==========================================================================
  # GitHub Release — create / update v4.0.0-beta and attach assets
  # ==========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [publish-docker, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create / update releases
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Couchbase Query Analyzer 4.0.0-beta"
          prerelease: true
          draft: false
          body: |
            ## 🧪 Couchbase Query Analyzer 4.0.0-beta

            **This is a public pre-release** — feedback welcome on
            [GitHub Issues](https://github.com/${{ github.repository }}/issues).

            ### Downloads

            | Platform | File / Command |
            |----------|----------------|
            | Docker   | `docker pull ${{ secrets.DOCKERHUB_USERNAME }}/couchbase-query-analyzer:4.0.0-beta` |
            | macOS    | `QueryAnalyzer-4.0.0-beta-UNSIGNED-arm64.dmg` (Apple Silicon, unsigned) |
            | Windows  | `QueryAnalyzer-4.0.0-beta-UNSIGNED-x64.zip` (onedir, unsigned — not a Setup.exe) |

            Both desktop builds bundle `libcblite` / `cblite.dll` (Couchbase Lite).
            Open **http://localhost:8080**.

            ### macOS first-run

            Builds are **unsigned** and **Apple Silicon only**. Gatekeeper will
            block the first launch. The DMG also contains `README.txt` with
            this command. After dragging the app into `/Applications`:

            ```bash
            xattr -dr com.apple.quarantine /Applications/QueryAnalyzer.app
            ```

            Then double-click. A Terminal window will show live logs and
            your default browser will open `http://localhost:8080`. Use the
            🔍 menubar icon → **Quit** to stop the server.

            ### Windows

            Unzip the folder and run `QueryAnalyzer.exe` (keep `cblite.dll`
            next to the exe). A console window appears with live logs; the
            system-tray icon → **Quit** stops the server. SmartScreen will
            warn because the build is unsigned.

            ---

            **Branch**: `release-4.0.0-beta`
            **Commit**: `${{ github.sha }}`
            **Workflow run**: ${{ github.run_id }}
          files: |
            ./artifacts/QueryAnalyzer-${{ env.RELEASE_VERSION }}-UNSIGNED-arm64.dmg
            ./artifacts/QueryAnalyzer-${{ env.RELEASE_VERSION }}-UNSIGNED-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Release Summary
    needs: [publish-docker, build-macos, build-windows, publish-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 4.0.0-beta — Public Pre-Release

          | Stage | Status |
          |-------|--------|
          | Docker (Hub push) | ${{ needs.publish-docker.result }} |
          | macOS .dmg        | ${{ needs.build-macos.result }} |
          | Windows .exe      | ${{ needs.build-windows.result }} |
          | GitHub Release    | ${{ needs.publish-release.result }} |

          - Docker Hub: \`${{ secrets.DOCKERHUB_USERNAME }}/couchbase-query-analyzer:4.0.0-beta\`
          - GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
          EOF
