name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Determine release type
        id: release_type
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [[ "$VERSION" == 4.* ]]; then
            echo "EDITION=Server Edition" >> $GITHUB_OUTPUT
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" == 3.* ]]; then
            echo "EDITION=Static Edition" >> $GITHUB_OUTPUT
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "EDITION=Development" >> $GITHUB_OUTPUT
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Couchbase Query Analyzer ${{ steps.version.outputs.TAG }}"
          body: |
            ## Couchbase Query Analyzer ${{ steps.version.outputs.VERSION }} - ${{ steps.release_type.outputs.EDITION }}
            
            ### Downloads
            
            | Platform | Download |
            |----------|----------|
            | Docker | `docker pull ${{ secrets.DOCKERHUB_USERNAME }}/couchbase-query-analyzer:${{ steps.version.outputs.VERSION }}` |
            | macOS | See assets below |
            | Windows | See assets below |
            
            ### What's New
            
            See [release_notes.md](https://github.com/${{ github.repository }}/blob/main/release_notes.md) for details.
            
            ---
            
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/...v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ steps.release_type.outputs.PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Build macOS App (CBL via build-desktop)
  # ==========================================================================
  build-macos:
    name: Build macOS App
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v4')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - uses: ./.github/actions/build-desktop
        with:
          os: macos
          version: ${{ needs.create-release.outputs.version }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/QueryAnalyzer-${{ needs.create-release.outputs.version }}-UNSIGNED-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Build Windows onedir zip (CBL via build-desktop)
  # ==========================================================================
  build-windows:
    name: Build Windows Executable
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v4')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - uses: ./.github/actions/build-desktop
        with:
          os: windows
          version: ${{ needs.create-release.outputs.version }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/QueryAnalyzer-${{ needs.create-release.outputs.version }}-UNSIGNED-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Build and Push Docker Images
  # ==========================================================================
  build-docker:
    name: Build Docker Images
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: dockertags
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          # Pre-releases (e.g. 4.0.0-beta, 4.0.0-rc1) MUST NOT move :latest
          if [[ "$VERSION" == *-* ]]; then
            echo "TAGS=${{ secrets.DOCKERHUB_USERNAME }}/couchbase-query-analyzer:$VERSION" >> $GITHUB_OUTPUT
          else
            echo "TAGS=${{ secrets.DOCKERHUB_USERNAME }}/couchbase-query-analyzer:$VERSION,${{ secrets.DOCKERHUB_USERNAME }}/couchbase-query-analyzer:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/v4')
        uses: docker/build-push-action@v6
        with:
          # Dockerfile expects /app as build context (uses `COPY . .`)
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.dockertags.outputs.TAGS }}
          platforms: linux/amd64,linux/arm64
